# Production deployment — VPS behind Traefik
# Deploy: scp this file to VPS, then docker compose up -d

services:
  webhook-engine:
    image: ghcr.io/kingsleyonoh/webhook-engine:latest
    container_name: webhook-engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webhook-engine.rule=Host(`webhooks.kingsleyonoh.com`)"
      - "traefik.http.routers.webhook-engine.entrypoints=websecure"
      - "traefik.http.routers.webhook-engine.tls.certresolver=letsencrypt"
      - "traefik.http.services.webhook-engine.loadbalancer.server.port=3000"
    networks:
      - traefik-public
      - internal

  db:
    image: postgres:16-alpine
    container_name: webhook-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhooks"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: webhook-engine-redis
    restart: unless-stopped
    command: redis-server --requirepass REDACTED --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "REDACTED", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - internal

volumes:
  db-data:
  redis-data:

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge
